version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bugscope-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bugscope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-bugscope}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bugscope}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: bugscope-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bugscope}:${POSTGRES_PASSWORD:?Error: POSTGRES_PASSWORD must be configured in your .env file}@postgres:5432/${POSTGRES_DB:-bugscope}
      BUGSCOPE_HOST: 0.0.0.0
      BUGSCOPE_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: bugscope-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
